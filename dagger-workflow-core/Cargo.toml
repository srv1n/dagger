[package]
name = "dagger-workflow-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[features]
default = []
conformance = []
sqlite = ["dep:sqlx"]

[lints.clippy]
if_same_then_else = "allow"
large_enum_variant = "allow"
needless_borrow = "allow"
needless_return = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.105"
serde-saphyr = { version = "1.0.0-rc.1", default-features = false, features = ["deserialize"] }
serde_jcs = "0.2"
sha2 = "0.10"
thiserror = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"], optional = true }

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "durable_demo"
required-features = ["sqlite"]
