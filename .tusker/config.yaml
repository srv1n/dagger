schema: tusker.config/v1
project_id: dagger

storage:
  root: .tusker
  generated_root: .tusker/_generated
  evidence_root: .tusker/evidence
  events_root: .tusker/events
  attempts_root: .tusker/attempts

runtime:
  lease_backend: local
  lease_ttl_minutes: 120
  mutation_mode: single_user_local

automation:
  # Automation is opt-in. Registration keeps status projections fresh; only
  # an explicit operator change may authorize daemon dispatch.
  enabled: false
  # Editable semantic defaults. They are policy, not a machine-local model catalog.
  default_profile: codex_exec-gpt-6-sol-low

  dispatch_scope: armed_waves
  # The deterministic review-completion reactor is separately opt-in. Its
  # modes are disabled, shadow (read-only comparison), and authoritative.
  completion_reactor:
    mode: disabled
  trigger_states: [ready, rework]
  # Direct Codex is available after fresh setup. tusker acp setup can add the
  # pinned ACP adapter later when that machine has been configured for it.
  default_runner: codex_exec
  enabled_runners: [codex_exec, claude-code]
  workspace:
    strategy: worktree
    root: workspaces
  concurrency:
    max_active_runs: 2
    max_active_runs_per_project: 1
    max_concurrent_by_state:
      rework: 1
  runners:
    # Direct Codex is the current default runner. ACP is added only by its
    # explicit machine-local setup.
    codex_exec:
      kind: codex_exec
      command: codex exec --json --skip-git-repo-check -
    claude-code:
      kind: claude-code
      command: claude -p --output-format stream-json --input-format stream-json --permission-mode bypassPermissions
  fanout:
    enabled: false
    max_children: 0
    allowed_child_types: []
    merge_rule: manual_review
